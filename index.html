<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shrink">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Jordy's Shrink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, Apple system type. The search pill is the hero. A session is a plain transcript with a pinned composer. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --fg:#1d1d1f; --sec:#6e6e73; --accent:#0071e3;
  --hair:#d2d2d7; --fill:#e8e8ed; --bubble:#e9e9eb; --red:#ff3b30;
  --shadow:0 2px 14px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --fg:#f5f5f7; --sec:#a1a1a6; --accent:#2997ff;
    --hair:#38383a; --fill:#2c2c2e; --bubble:#26252a; --red:#ff453a;
    --shadow:0 2px 14px rgba(0,0,0,.55); color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fg:#f5f5f7; --sec:#a1a1a6; --accent:#2997ff;
  --hair:#38383a; --fill:#2c2c2e; --bubble:#26252a; --red:#ff453a;
  --shadow:0 2px 14px rgba(0,0,0,.55); color-scheme:dark
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.47;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.home{padding-top:clamp(36px,16vh,130px)}
h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:0;text-wrap:balance}
.sub{color:var(--sec);font-size:19px;margin:8px 0 28px}
.pill{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:30px;box-shadow:var(--shadow);padding:8px 8px 8px 18px;min-height:58px;transition:box-shadow .15s,border-color .15s}
.pill:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent),var(--shadow)}
.pill .mag{width:22px;height:22px;color:var(--sec);flex:none;margin:9px 0}
.pill textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:19px;line-height:1.35;resize:none;outline:none;padding:9px 0;max-height:170px;overflow-y:auto}
.pill textarea::placeholder{color:var(--sec)}
.send,.stop{width:40px;height:40px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#fff;background:var(--accent);transition:opacity .15s}
.send[disabled]{opacity:.3;cursor:default}
.stop{background:var(--fg);color:var(--bg)}
.send svg,.stop svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{appearance:none;border:0;font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--fill);color:var(--fg);cursor:pointer}
.chip:active{opacity:.7}
.block{margin-top:40px}
.label{font-size:13px;color:var(--sec);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.block p{margin:6px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .d{color:var(--sec);font-size:15px;margin-top:2px}
.row .chev{color:var(--hair);flex:none;width:18px;height:18px}
.links{display:flex;gap:22px;margin-top:40px}
.tbtn{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:17px;font-weight:500;padding:6px 0;cursor:pointer}
.tbtn.danger{color:var(--red)}
.tbtn:disabled{color:var(--sec);cursor:default}
.tbtn:focus-visible,.chip:focus-visible,.send:focus-visible,.stop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.foot{margin-top:56px;color:var(--sec);font-size:14px}
.foot b{font-weight:600;color:var(--fg);user-select:all;-webkit-user-select:all}
.note{color:var(--sec);font-size:14px;min-height:20px;margin-top:10px}
.note.err{color:var(--red)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:10px;z-index:5;min-height:52px}
.bar .title{font-weight:600;font-size:17px;color:var(--sec)}
.msgs{display:flex;flex-direction:column;gap:16px;padding-top:12px;padding-bottom:150px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;max-width:100%}
.msg.me{align-self:flex-end;background:var(--bubble);border-radius:20px;padding:10px 16px;max-width:84%;font-size:17px}
.msg.them{font-size:18px;line-height:1.5;max-width:62ch}
.thinking{color:var(--sec)}
@media (prefers-reduced-motion:no-preference){
  .thinking{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.composer .in{max-width:680px;margin:0 auto}
.composer .pill{min-height:52px;border-radius:26px}
.composer textarea{font-size:17px}
.composer .note{margin-top:6px;min-height:0}
.memo{width:100%;min-height:62vh;font:inherit;font-size:16px;line-height:1.5;padding:16px;border-radius:18px;border:1px solid var(--hair);background:var(--surface);color:var(--fg);resize:vertical;outline:none}
.memo:focus{border-color:var(--accent)}
.meta{color:var(--sec);font-size:14px;margin:4px 0 12px}
.empty{color:var(--sec);padding:24px 0}
</style>

<main id="home" class="wrap home">
  <h1 id="greet">Good morning, Jordy.</h1>
  <p class="sub" id="homeSub">What's on your mind?</p>
  <form id="homeForm" class="pill">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <textarea id="homeBox" rows="1" placeholder="Say anything" aria-label="Say anything" autocomplete="off"></textarea>
    <button class="send" id="homeSend" type="submit" disabled aria-label="Start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="chips" id="chips">
    <button class="chip" type="button" data-say="I'm anxious and I don't know why">I'm anxious</button>
    <button class="chip" type="button" data-say="Something's off with Bonnie">Something with Bonnie</button>
    <button class="chip" type="button" data-say="I lost my patience with Luna">Luna</button>
    <button class="chip" type="button" data-say="Nothing's wrong, just checking in">Just checking in</button>
  </div>
  <div class="note" id="homeNote"></div>
  <div id="homeBlocks"></div>
  <div class="links">
    <button class="tbtn" type="button" data-act="profile">Memory</button>
    <button class="tbtn" type="button" data-act="history">Sessions</button>
  </div>
  <p class="foot">If it's past a seven and you can't bring it down, MensLine is 24 hours. <b>1300 78 99 78</b></p>
</main>

<main id="session" class="wrap" hidden>
  <div class="bar">
    <span class="title" id="sessTitle">Session</span>
    <button class="tbtn" type="button" data-act="end" id="endBtn">Done</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <div class="in">
      <form id="sessForm" class="pill">
        <textarea id="sessBox" rows="1" placeholder="Say it" aria-label="Say it" autocomplete="off"></textarea>
        <button class="send" id="sessSend" type="submit" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <button class="stop" id="sessStop" type="button" hidden aria-label="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </form>
      <div class="note" id="sessNote"></div>
    </div>
  </div>
</main>

<main id="profile" class="wrap" hidden>
  <div class="bar">
    <button class="tbtn" type="button" data-act="home">Back</button>
    <span class="title">Memory</span>
    <button class="tbtn" type="button" data-act="saveProfile" id="saveProfile">Save</button>
  </div>
  <p class="meta" id="profMeta">What it knows about you. It rewrites this after every session. You can change anything.</p>
  <textarea class="memo" id="profText" aria-label="What it knows about you"></textarea>
  <div class="note" id="profNote"></div>
  <button class="tbtn danger" type="button" data-act="restoreProfile" id="restoreBtn">Restore the previous version</button>
</main>

<main id="history" class="wrap" hidden>
  <div class="bar">
    <button class="tbtn" type="button" data-act="home">Back</button>
    <span class="title">Sessions</span>
    <span></span>
  </div>
  <div id="sessList"></div>
</main>

<main id="read" class="wrap" hidden>
  <div class="bar">
    <button class="tbtn" type="button" data-act="history">Back</button>
    <span class="title" id="readTitle"></span>
    <span></span>
  </div>
  <div class="msgs" id="readMsgs" style="padding-bottom:40px"></div>
</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const FALLBACK='Jordy, 34, finance broker on the Gold Coast, works from home on commission. Wife Bonnie. Daughter Luna, four. His full profile loads from memory when memory is available. Until then, ask.';

const RULES=`You are Jordy's shrink. Not a chatbot, not a coach, not a cheerleader. A straight talking therapist who knows him well and talks like a real person. He opens this page when something is on his mind and types whatever it is. You take it from there.

How you talk
Short. Most replies are three to six sentences. He gets overwhelmed by long replies and has said so. Go longer only when he asks for detail or a script.
Plain English. No jargon, no therapy speak. Never say things like I hear you, that sounds really hard, thank you for sharing, I'm here for you.
No dashes of any kind, no brackets, no bullet points, no numbered lists, no headings, no bold, no emoji, no markdown. Short paragraphs with a blank line between them.
Australian spelling. Casual. Mate now and then, not every message. Swearing only if he does first, and rarely.
Direct. Don't sugar coat, don't pad, don't hedge. Say the thing.
Don't ask permission and don't offer menus of options. Make the call and tell him.
Don't start with a greeting or a recap of what he said. Start with the read.

What a reply does
Usually three things, in this order. Name what you actually see, the pattern underneath the words, not just the words. Give one practical move or reframe he can use today. Ask one question. Never more than one question. Sometimes the right move is no question.
When he can't name what he's feeling or seems overwhelmed, give him three short options to pick from, each on its own line with no numbering, and ask which one fits.
Use what you know about him. Connect what he's saying now to his patterns and his history when it fits, and name the pattern by its number from his list when it is one. Don't recite his file back at him.
Hold him to account, kindly. When he's doing one of his patterns inside the message itself, point at it. When he blames Bonnie or Luna for his state, give him his part without letting him off the hook and without running them down. When the leaving thought shows up, name it as the escape hatch and remind him nothing gets decided from empty.
When he's done a real rep, say so in one line and move on. No fuss.
Ask about the body early if it fits. Sleep, food, where the tank is. Most of his bad nights start empty.
Don't diagnose him or anyone else. Don't put labels on Bonnie.
If he pushes back on a read, take it seriously. He's usually right when he does.
Never mention being an AI, a model, or this page. Don't tell him you're not a real therapist in every message, he knows. Once a session at most, if it fits, point him at the real help he hasn't taken up yet.
If he says he's done, or bye, say one line and stop. No sign off speech.

Safety
If he describes losing it physically with Luna or Bonnie, or being about to, or says he's a danger to anyone, or talks about not wanting to be here, drop everything else. Give the numbers plainly, once. MensLine 1300 78 99 78, any hour. Men's Referral Service 1300 766 491, any hour. If anyone is in danger right now, 000. Then stay with him.
He has been referred to the men's behaviour change program on the Gold Coast, 07 5591 4222, and has not rung it. Bring it up when it's relevant, not every session.`;

let hasClaude=!!(window.claude&&typeof window.claude.use==='function');
let db=null,sample=null,sampleP=null,profile=null,sessions=[],session=null,ctl=null,busy=false,view='home',saveChain=Promise.resolve(),restoreArmed=false;

function iso(){return new Date().toISOString()}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDate(s){const d=new Date(s);return DAYS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function fmtTime(d){let h=d.getHours();const m=('0'+d.getMinutes()).slice(-2);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+m+ap}
function greetWord(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function todayLine(){const d=new Date();return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}

function go(v){view=v;['home','session','profile','history','read'].forEach(id=>{$('#'+id).hidden=(id!==v)});window.scrollTo(0,0)}
function note(id,msg,err){const el=$('#'+id);if(!el)return;el.textContent=msg||'';el.classList.toggle('err',!!err)}
function autosize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,170)+'px'}
function scrollEnd(){window.scrollTo(0,document.body.scrollHeight)}

function copyFor(c){
  switch(c){
    case 'not_granted':return 'You have not allowed this page to use Claude. Reload and allow it when it asks.';
    case 'rate_limited':return 'Claude is busy or you have hit your limit. Give it a minute and send again.';
    case 'session_expired':return 'Sign in to Claude again, then reload.';
    case 'refused':return 'Claude would not answer that one. Say it a different way.';
    case 'prompt_too_large':return 'This session has got too long. Hit Done and start a fresh one.';
    case 'empty_completion':return 'Nothing came back. Say it again with a bit more.';
    case 'invalid_json':return 'Could not read the summary. The session is saved anyway.';
    case 'sampling_disabled':case 'not_declared':case 'capability_disabled':case 'capability_removed':return 'Claude is not available on this page right now.';
    case 'upstream_error':return 'Connection dropped. Send that again.';
    default:return 'Something went wrong. Try again.';
  }
}

function systemTurn(){
  const d=new Date();
  const recent=sessions.filter(s=>s.endedAt&&s.summary&&(!session||s.id!==session.id)).slice(0,6).map(s=>fmtDate(s.startedAt)+': '+s.summary).join('\n')||'None yet.';
  return RULES+'\n\nRIGHT NOW\n'+DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+fmtTime(d)+'.\n\nWHAT YOU KNOW ABOUT HIM\n'+((profile&&profile.notes)||FALLBACK)+'\n\nRECENT SESSIONS, newest first\n'+recent+'\n\nThe session starts now. Everything after this is Jordy talking to you. Reply as his shrink, in plain text.';
}
function closePrompt(s){
  const t=s.turns.map(x=>(x.role==='user'?'Jordy: ':'Shrink: ')+x.content).join('\n\n');
  return 'You are the shrink who keeps a running profile on Jordy. Below is the profile as it stands, then the transcript of the session that just ended on '+fmtDate(s.startedAt)+'.\n\nReply with only JSON shaped like {"summary": "...", "profile": "..."}.\nsummary: one or two plain sentences in the third person, past tense, what the session was about and where it landed. No dashes.\nprofile: the full updated profile text. Keep the same headings and every line that is still true. Change only what this session showed is now wrong or has moved on. Add anything genuinely new about him, his patterns, his family, or what works and what does not, under the right heading. Rewrite the CURRENT THREADS section so it is short and current, dated with this month and year. Under 900 words. Plain text with line breaks. No markdown, no dashes, no brackets, no bullet points.\n\nPROFILE\n'+((profile&&profile.notes)||FALLBACK)+'\n\nTRANSCRIPT\n'+t;
}

function renderHome(){
  $('#greet').textContent=greetWord()+', Jordy.';
  $('#homeSub').textContent=todayLine()+'. What\'s on your mind?';
  const b=$('#homeBlocks');b.innerHTML='';
  const open=sessions.find(s=>!s.endedAt&&s.turns&&s.turns.length>1);
  if(open){
    const d=document.createElement('div');d.className='block';
    d.innerHTML='<div class="label">Unfinished</div><div class="row" data-act="continue"><div><div class="t">Pick up where you left off</div><div class="d"></div></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>';
    d.querySelector('.d').textContent=fmtDate(open.startedAt)+', '+open.opener.slice(0,90);
    b.appendChild(d);
  }
  const last=sessions.find(s=>s.endedAt);
  if(last){
    const d=document.createElement('div');d.className='block';
    d.innerHTML='<div class="label">Last time</div><p></p><p class="meta" style="margin-top:4px"></p>';
    d.querySelector('p').textContent=last.summary||last.opener;
    d.querySelector('.meta').textContent=fmtDate(last.startedAt);
    b.appendChild(d);
  }
  if(!db&&hasClaude){const d=document.createElement('p');d.className='meta';d.style.marginTop='28px';d.textContent='Memory is off in this view. Sessions here are not saved.';b.appendChild(d)}
}

function addMsg(container,role,text){
  const el=document.createElement('div');el.className='msg '+(role==='user'?'me':'them');el.textContent=text;container.appendChild(el);return el;
}
function renderTurns(){
  const m=$('#msgs');m.innerHTML='';
  if(!session)return;
  session.turns.forEach(t=>addMsg(m,t.role,t.content));
  $('#sessTitle').textContent=fmtDate(session.startedAt)+', '+fmtTime(new Date(session.startedAt));
}
function setBusy(on){
  busy=on;
  $('#sessSend').hidden=on;$('#sessStop').hidden=!on;
  $('#sessBox').disabled=on;$('#endBtn').disabled=false;
}

async function ensureSample(){
  if(sample)return sample;
  if(sampleP){try{sample=await sampleP}catch(e){sample=null}}
  return sample;
}

async function ask(){
  const s=await ensureSample();
  if(!s){note('sessNote','Claude is not available on this page right now.',true);return}
  const m=$('#msgs');
  ctl=new AbortController();setBusy(true);note('sessNote','');
  const el=addMsg(m,'assistant','Thinking…');el.classList.add('thinking');scrollEnd();
  const input=[{role:'user',content:systemTurn()}].concat(session.turns.slice(-30).map(t=>({role:t.role,content:t.content})));
  try{
    const r=await s(input,{cache:false,signal:ctl.signal,modelTier:'default',effort:'low',onText:u=>{el.classList.remove('thinking');el.textContent=u.text;scrollEnd()}});
    el.classList.remove('thinking');el.textContent=r.text;
    session.turns.push({role:'assistant',content:r.text,at:iso()});
    if(r.truncated)note('sessNote','That got cut short. Ask for less at a time.');
    queueSave(session);
  }catch(e){
    el.classList.remove('thinking');
    if(e&&e.text){el.textContent=e.text;session.turns.push({role:'assistant',content:e.text,at:iso()});queueSave(session)}else el.remove();
    if(e&&e.code!=='cancelled')note('sessNote',copyFor(e&&e.code),true);
  }finally{ctl=null;setBusy(false);$('#sessBox').focus()}
}

function queueSave(s){
  if(!db)return;
  const snap=JSON.parse(JSON.stringify(s));
  saveChain=saveChain.then(()=>db.doc('sessions/'+snap.id).set(snap)).catch(e=>{note('sessNote','Could not save this session.',true)});
}

async function startSession(text){
  text=(text||'').trim();if(!text||busy)return;
  const open=sessions.find(s=>!s.endedAt&&s.turns&&s.turns.length>1);
  session={id:newId(),startedAt:iso(),opener:text,turns:[{role:'user',content:text,at:iso()}],summary:null,endedAt:null};
  sessions.unshift(session);
  $('#homeBox').value='';autosize($('#homeBox'));$('#homeSend').disabled=true;
  go('session');renderTurns();
  if(open){note('sessNote','Saving last time first…');await closeSession(open);note('sessNote','')}
  await ask();
}
function continueSession(){
  const open=sessions.find(s=>!s.endedAt&&s.turns&&s.turns.length>1);
  if(!open)return;session=open;go('session');renderTurns();scrollEnd();$('#sessBox').focus();
}
async function sendTurn(text){
  text=(text||'').trim();if(!text||busy||!session)return;
  addMsg($('#msgs'),'user',text);
  session.turns.push({role:'user',content:text,at:iso()});
  $('#sessBox').value='';autosize($('#sessBox'));$('#sessSend').disabled=true;
  scrollEnd();
  await ask();
}

async function closeSession(s){
  let summary=null,notes=null;
  const sm=await ensureSample();
  if(sm&&s.turns.some(t=>t.role==='assistant')){
    try{
      const r=await sm.json(closePrompt(s),{modelTier:'default',effort:'low',cache:false});
      if(r&&typeof r.summary==='string'&&r.summary.trim())summary=r.summary.trim();
      if(r&&typeof r.profile==='string'&&r.profile.trim().length>300)notes=r.profile.trim();
    }catch(e){if(e&&e.code&&e.code!=='cancelled')note('homeNote',copyFor(e.code),true)}
  }
  s.summary=summary||('Started with: '+s.opener.slice(0,100));
  s.endedAt=iso();
  if(db){
    try{
      await saveChain;
      await db.doc('sessions/'+s.id).set(JSON.parse(JSON.stringify(s)));
      if(notes){profile={notes,prev:(profile&&profile.notes)||'',updatedAt:iso()};await db.doc('profile/me').set(profile)}
    }catch(e){note('homeNote','Could not save that session.',true)}
  }
}
async function endSession(){
  if(ctl)ctl.abort();
  const s=session;session=null;
  go('home');renderHome();
  if(!s)return;
  if(!s.turns.some(t=>t.role==='assistant')){sessions=sessions.filter(x=>x.id!==s.id);renderHome();return}
  note('homeNote','Saving and updating memory…');
  await closeSession(s);
  note('homeNote','Saved.');renderHome();
  setTimeout(()=>{if($('#homeNote').textContent==='Saved.')note('homeNote','')},4000);
}

function showProfile(){
  go('profile');
  $('#profText').value=(profile&&profile.notes)||'';
  $('#profMeta').textContent=profile&&profile.updatedAt?'Updated '+fmtDate(profile.updatedAt)+'. It rewrites this after every session. You can change anything.':'Nothing saved yet. It fills this in after your first session, or write it yourself.';
  $('#restoreBtn').hidden=!(profile&&profile.prev);$('#restoreBtn').textContent='Restore the previous version';restoreArmed=false;
  note('profNote',db?'':'Memory is off in this view, so this will not save.',!db);
}
async function saveProfile(){
  const v=$('#profText').value.trim();
  if(!db){note('profNote','Memory is off in this view.',true);return}
  $('#saveProfile').disabled=true;
  try{profile={notes:v,prev:(profile&&profile.notes)||'',updatedAt:iso()};await db.doc('profile/me').set(profile);note('profNote','Saved.')}
  catch(e){note('profNote','Could not save.',true)}
  $('#saveProfile').disabled=false;
}
async function restoreProfile(){
  if(!profile||!profile.prev)return;
  if(!restoreArmed){restoreArmed=true;$('#restoreBtn').textContent='Tap again to restore the previous version';return}
  $('#profText').value=profile.prev;restoreArmed=false;$('#restoreBtn').textContent='Restore the previous version';
  await saveProfile();
}

function showHistory(){
  go('history');
  const l=$('#sessList');l.innerHTML='';
  const done=sessions.filter(s=>s.turns&&s.turns.length>1);
  if(!done.length){l.innerHTML='<p class="empty">No sessions yet.</p>';return}
  done.forEach(s=>{
    const r=document.createElement('div');r.className='row';r.dataset.act='read';r.dataset.id=s.id;
    r.innerHTML='<div><div class="t"></div><div class="d"></div></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    r.querySelector('.t').textContent=fmtDate(s.startedAt)+', '+fmtTime(new Date(s.startedAt));
    r.querySelector('.d').textContent=s.summary||s.opener;
    l.appendChild(r);
  });
}
function showRead(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  go('read');
  $('#readTitle').textContent=fmtDate(s.startedAt);
  const m=$('#readMsgs');m.innerHTML='';
  s.turns.forEach(t=>addMsg(m,t.role,t.content));
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-say]');if(!t)return;
  if(t.dataset.say){$('#homeBox').value=t.dataset.say;autosize($('#homeBox'));$('#homeSend').disabled=false;$('#homeBox').focus();return}
  const a=t.dataset.act;
  if(a==='home'){go('home');renderHome()}
  else if(a==='profile')showProfile();
  else if(a==='history')showHistory();
  else if(a==='read')showRead(t.dataset.id);
  else if(a==='continue')continueSession();
  else if(a==='end')endSession();
  else if(a==='saveProfile')saveProfile();
  else if(a==='restoreProfile')restoreProfile();
});
$('#homeForm').addEventListener('submit',ev=>{ev.preventDefault();startSession($('#homeBox').value)});
$('#sessForm').addEventListener('submit',ev=>{ev.preventDefault();sendTurn($('#sessBox').value)});
$('#sessStop').addEventListener('click',()=>{if(ctl)ctl.abort()});
[['homeBox','homeSend'],['sessBox','sessSend']].forEach(([b,s])=>{
  const box=$('#'+b),btn=$('#'+s);
  box.addEventListener('input',()=>{autosize(box);btn.disabled=!box.value.trim()});
  box.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();if(!btn.disabled)box.form.requestSubmit()}});
});

async function init(){
  renderHome();
  if(!hasClaude){note('homeNote','Open this from your Claude account for it to talk back.',true);$('#homeSend').disabled=true;$('#homeBox').disabled=true;return}
  sampleP=window.claude.use('sample');
  const dbP=window.claude.use('db');
  try{db=await dbP}catch(e){db=null}
  if(db){
    try{const p=await db.doc('profile/me').get();if(p.exists)profile=p.data()}catch(e){}
    try{const q=await db.collection('sessions').orderBy('startedAt','desc').limit(40).get();sessions=q.docs.map(d=>d.data()).filter(s=>s&&s.id&&Array.isArray(s.turns))}catch(e){}
  }
  if(view==='home')renderHome();
  sample=await sampleP;
  if(!sample)note('homeNote','Claude is not available on this page right now.',true);
}
function start(data){
  if(data&&data.session&&Array.isArray(data.session.turns)){session=data.session;sessions.unshift(session);go('session');renderTurns()}
  init();
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function')window.claude.hot.snapshot(()=>({session}));
if(window.claude&&window.claude.hot&&typeof window.claude.hot.ready==='function')window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body>
</html>
